[package]
name = "mailgw-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
imap-codec = { version = "=2.0.0-alpha.10", default-features = false, features = ["starttls", "ext_id", "ext_namespace", "ext_list_extended", "ext_utf8"] }
mail-parser = "0.11.4"
smtp-proto = "0.2.5"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
