[package]
name = "mailgw-tear"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone like ../fuzz: a test harness, not part of the gateway workspace, its lint gate or
# its images. It compiles the gateway's Remote store adapter from source (#[path] modules in
# main.rs), so the dependencies below mirror ../mailgw/Cargo.toml for those modules.
[workspace]

[dependencies]
mailgw-core = { path = "../core" }
# tear (anomalyco/tear, crate name statecheck): pinned by rev, never a floating branch.
statecheck = { git = "https://github.com/anomalyco/tear", rev = "f59e9fba3bd96173c3c0775f9f8df931a202939f" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "macros", "sync", "time", "signal", "test-util"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
webpki-roots = "1"
zeroize = "1"

[profile.release]
debug = false
incremental = true
