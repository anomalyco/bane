[package]
name = "mailgw"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mailgw-core = { path = "../core" }
anyhow = "1"
chrono = {version="0.4",features=["serde"]}
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
serde = {version="1",features=["derive"]}
serde_json = "1"
reqwest = {version="0.12",default-features=false,features=["rustls-tls","json","stream"]}
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"
zeroize = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
webpki-roots = "1"
tempfile="3"
tokio-util={version="0.7",features=["io"]}
futures-util = "0.3"

[lints]
workspace = true

[dev-dependencies]
imap = "2.4"
native-tls = "0.2"
