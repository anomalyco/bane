name: Build release
description: Install locked release dependencies and build Worker assets and the SDK CLI
runs:
  using: composite
  steps:
    - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version: 24.16.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14
    - shell: bash
      run: |
        for pkg in api app sdk; do (cd "$pkg" && bun install --frozen-lockfile); done
        (cd sdk && bun run build)
        (cd app && bun run build)
