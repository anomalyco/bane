name: Bane infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or explicitly apply the production plan
        default: plan
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: infra-production
  cancel-in-progress: false

jobs:
  infra:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
      TF_VAR_database: ${{ secrets.TF_VAR_DATABASE }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.13.1
      # R2's S3 API accepts a Cloudflare API token as credentials: the token ID is the access
      # key and the SHA-256 of the token value is the secret. Use a dedicated infra user token.
      - name: Derive R2 state credentials
        run: |
          id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq -er 'select(.success) | .result.id | strings | select(length > 0)')
          secret=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          echo "AWS_ACCESS_KEY_ID=$id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
      - run: tofu init -input=false -backend-config="key=production/terraform.tfstate"
      - run: tofu plan -input=false -var-file=production.tfvars -out="$RUNNER_TEMP/production.tfplan"
      - if: inputs.operation == 'apply'
        run: tofu apply -input=false "$RUNNER_TEMP/production.tfplan"
