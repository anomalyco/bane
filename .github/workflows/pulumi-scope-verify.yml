name: Pulumi scope verify

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CF_ACCOUNT_ID: "15d29c8639fd3733b1b5486a2acfd968"

jobs:
  verify:
    name: Verify bane token scope
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-dev
          aws-region: us-east-1

      - name: Mint Cloudflare token
        run: |
          set -euo pipefail
          set +x
          url="https://kjivkui2evldapbok5fhrrl6oy0fctkp.lambda-url.us-east-1.on.aws/"
          response=$(
            printf 'user = "%s:%s"\nheader = "x-amz-security-token: %s"\n' \
              "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" |
              curl --config - --proto '=https' --proto-redir '=https' \
                --aws-sigv4 "aws:amz:us-east-1:lambda" \
                --request POST --url "$url" \
                --fail-with-body --silent --show-error --max-time 20
          )
          token=$(printf '%s' "$response" | jq -er '.token | strings')
          printf '::add-mask::%s\n' "$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Probe Worker scope
        run: |
          set -uo pipefail
          get() {
            printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
              curl --config - -s -o /dev/null -w '%{http_code}' \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$1/$2"
          }
          fail=0
          expect() {
            local want=$1 name=$2 sub=$3
            local got
            got=$(get "$name" "$sub")
            echo "$name/$sub -> $got (want $want)"
            [ "$got" = "$want" ] || fail=1
          }
          expect 200 bane-dev settings
          expect 200 bane-dev secrets
          expect 403 anoma-ly settings
          expect 403 anoma-ly secrets
          expect 403 opensend-mx settings
          if [ "$fail" != "0" ]; then echo "::error::worker scope check failed"; exit 1; fi
          echo "bane-dev editable, every other Worker denied"
