name: Publish SDK

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'production' &&
      github.event.workflow_run.path == '.github/workflows/deploy-prod.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHA: ${{ github.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            [[ $GITHUB_REF == refs/heads/production ]] || { echo '::error::Dispatch SDK publishing from production'; exit 1; }
          fi
          repo="repos/$GITHUB_REPOSITORY"
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            sha=$SHA
            [[ $sha =~ ^[0-9a-f]{40}$ ]]
            runs=$(gh api --paginate --slurp "$repo/actions/workflows/deploy-prod.yml/runs?status=success&branch=production&per_page=100")
            attempts=$(jq -r --arg repo "$GITHUB_REPOSITORY" '.[] | .workflow_runs[] | select(.head_branch == "production" and .head_repository.full_name == $repo) | "\(.id)/attempts/\(.run_attempt)"' <<< "$runs")
          else
            # The gate job name carries the exact commit deploy-prod shipped,
            # which can differ from the run's head_sha when it was dispatched
            # with an older ref.
            attempts="$RUN/attempts/$ATTEMPT"
            jobs=$(gh api "$repo/actions/runs/$attempts/jobs?filter=latest&per_page=100")
            sha=$(jq -r 'first(.jobs[] | select(.name | test("^Deploy production [0-9a-f]{40}$")) | .name | sub("^Deploy production "; "")) // empty' <<< "$jobs")
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo 'Skipped SDK publish: production did not deploy this commit.' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          gh api "$repo/compare/$sha...production?per_page=1" | jq -e --arg sha "$sha" '.merge_base_commit.sha == $sha' >/dev/null || { echo "::error::$sha is not reachable from production"; exit 1; }
          for attempt in $attempts; do
            jobs=$(gh api "$repo/actions/runs/$attempt/jobs?filter=latest&per_page=100")
            if jq -e --arg job "Deploy production $sha" 'any(.jobs[]; .name == $job and .conclusion == "success" and any(.steps[]; .name == "Live production E2E (safe subset)" and .conclusion == "success"))' <<< "$jobs"; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then echo "::error::No successful production deploy for $sha"; exit 1; fi
          echo 'Skipped SDK publish: production did not deploy this commit.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-banemx
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.13.0
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - id: version
        name: Check published version
        working-directory: sdk
        shell: bash
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$package@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$package@$version is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$package@$version will be published"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance
        working-directory: sdk
