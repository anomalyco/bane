name: Publish SDK

on:
  workflow_run:
    workflows: [Deploy dev]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/deploy-dev.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          [[ $GITHUB_REF == refs/heads/main ]] || { echo '::error::SDK publishing requires main'; exit 1; }
          repo="repos/$GITHUB_REPOSITORY"
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            sha=$GITHUB_SHA
          else
            [[ $TITLE =~ ^Dev\ ([0-9a-f]{40})$ ]]; sha=${BASH_REMATCH[1]}
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          gh api "$repo/compare/$sha...main?per_page=1" | jq -e --arg sha "$sha" '.merge_base_commit.sha == $sha' >/dev/null || { echo "::error::$sha is not reachable from main"; exit 1; }
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            runs=$(gh api --paginate --slurp "$repo/actions/workflows/deploy-dev.yml/runs?status=success&branch=main&per_page=100")
            attempts=$(jq -r --arg title "Dev $sha" --arg repo "$GITHUB_REPOSITORY" '.[] | .workflow_runs[] | select(.display_title == $title and .head_repository.full_name == $repo and (.event == "workflow_run" or .event == "workflow_dispatch")) | "\(.id)/attempts/\(.run_attempt)"' <<< "$runs")
          else
            attempts="$RUN/attempts/$ATTEMPT"
          fi
          for attempt in $attempts; do
            jobs=$(gh api "$repo/actions/runs/$attempt/jobs?per_page=100")
            if jq -e --arg job "Verify dev $sha" 'any(.jobs[]; .name == $job and .conclusion == "success" and any(.steps[]; .name == "Live dev E2E" and .conclusion == "success"))' <<< "$jobs"; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then echo "::error::No successful Live dev E2E for $sha"; exit 1; fi
          echo 'Skipped SDK publish: dev did not verify this commit.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-banemx
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.13.0
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - id: version
        name: Check published version
        working-directory: sdk
        shell: bash
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$package@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$package@$version is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$package@$version will be published"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance
        working-directory: sdk
