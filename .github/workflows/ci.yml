name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  # The merge queue on dev tests each pull request merged onto the latest dev and the entries ahead of it, and merges
  # only if the required checks (build, acceptance) pass there (docs/ci.md).
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - &bun-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('*/bun.lock', '.github/s3-fixture/bun.lock') }}
      - run: for pkg in api sdk app mcp; do (cd "$pkg" && bun install --frozen-lockfile); done
      # docs:check compiles the regenerated SDK; the MCP build already checks its types.
      - run: (cd api && bun run check) && (cd mcp && bun run build)
      - name: Type-check the live SDK CLI probe
        working-directory: api
        run: ./node_modules/.bin/tsc --ignoreConfig --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --lib ES2023,DOM,DOM.Iterable --types node scripts/e2e-upload-cli.ts
      # What broke dev after merge, checked before it: live E2E coverage, Cloudflare routing, migration order and
      # numbers (against dev and older open PRs), and phone card slots. docs/ci.md explains each failure.
      - name: Pre-merge invariants
        working-directory: api
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: |
          # A pull request's checkout is GitHub's merge into the current base: its first parent is that base.
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then BASE=$(git rev-parse HEAD^1); fi
          node --import tsx scripts/check-premerge.ts --base "$BASE"
      - run: cd app && bun run build
      - name: Build API and bundle both Workers without deploying
        working-directory: api
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          bun run build
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.dev.jsonc --outdir "$RUNNER_TEMP/worker"
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.prod.jsonc --outdir "$RUNNER_TEMP/worker-prod"
      - name: Regenerate and verify public docs, spec and SDK
        run: |
          (cd api && bun run docs:check)
          git diff --exit-code -- api/openapi.json sdk/src mcp/src/brand.ts
          test -z "$(git ls-files --others --exclude-standard -- sdk/src mcp/src/brand.ts)"
      - name: Public API compatibility
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node api/scripts/check-api-contract.mjs --self-test
          head=$GITHUB_SHA
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            # HEAD in the build checkout is GitHub's synthetic merge. Compare
            # the actual PR head against its merge-base, not the updated dev.
            head=$PR_HEAD; BASE=$(git merge-base "$head" "$BASE")
          elif [[ $GITHUB_EVENT_NAME == merge_group ]]; then
            # The queue's commit merges one pull request onto dev and the entries ahead of it (its first parent), so
            # compare just that step. Its ref names the pull request: refs/heads/gh-readonly-queue/dev/pr-<n>-<sha>.
            BASE=$(git rev-parse HEAD^1); ALLOWED=false
            pr=$(sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$QUEUE_REF")
            if [[ -n $pr ]] && gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.labels[].name' | grep -qx api-breaking; then ALLOWED=true; fi
          else
            repo="repos/$GITHUB_REPOSITORY"
            prs=$(gh api --paginate --slurp "$repo/commits/$head/pulls?per_page=100")
            pr=$(jq -r --arg sha "$head" --arg repo "$GITHUB_REPOSITORY" '[.[][] | select(.merged_at and .base.repo.full_name == $repo and .base.ref == "dev" and .merge_commit_sha == $sha and any(.labels[]; .name == "api-breaking"))][0].number // empty' <<< "$prs")
            ALLOWED=false
            if [[ -n $pr ]] && git merge-base --is-ancestor "$BASE" "$head"; then
              commits=$(git rev-list "$BASE..$head"); ALLOWED=true
              for sha in $commits; do
                associated=$(gh api --paginate --slurp "$repo/commits/$sha/pulls?per_page=100")
                if ! jq -e --argjson pr "$pr" 'any(.[][]; .number == $pr)' <<< "$associated" >/dev/null; then ALLOWED=false; break; fi
              done
            fi
          fi
          git show "$BASE:api/openapi.json" > "$RUNNER_TEMP/base.json"
          git show "$head:api/openapi.json" > "$RUNNER_TEMP/head.json"
          args=(); if [[ $ALLOWED == true ]]; then args+=(--allow-breaking); fi
          node api/scripts/check-api-contract.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" "${args[@]}"

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # M6: fail on any high or critical advisory in a locked dependency (runtime and tooling alike;
      # bun audit reads bun.lock). Fix by upgrading or a patch-level override in that package.json.
      # An ignore must name the advisory, why it cannot reach Bane, and what removes it.
      - name: Audit locked dependencies for high and critical advisories
        run: |
          set -euo pipefail
          # app: happy-dom is the Node entry of @tiptap/html; the dashboard bundle resolves its browser
          # entry (no happy-dom in app/dist). @tiptap/html's peer range ^20 excludes the fixed 21.0.4.
          for pkg in api app sdk mcp; do
            args=(--audit-level=high)
            case $pkg in app) args+=(--ignore=GHSA-834v-8h66-3h79 --ignore=GHSA-c8p4-j97h-3vg8);; esac
            echo "::group::bun audit $pkg"; (cd "$pkg" && bun audit "${args[@]}"); echo '::endgroup::'
          done

  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gateway/target
          key: cargo-${{ runner.os }}-${{ hashFiles('gateway/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format, lint and unit tests
        run: cargo fmt --all --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: fixture-admin
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - *bun-cache
      # The stdio MCP acceptance test starts ../mcp/src/server.ts, which needs the MCP package's dependencies.
      - run: for pkg in api mcp .github/s3-fixture; do (cd "$pkg" && bun install --frozen-lockfile); done
      # Also the deadlock guard: Postgres detects lock cycles after 50 ms and logs lock waits, and the job fails on
      # any deadlock it counted, printing each cycle from the service's log (docs/ci.md).
      - name: Run all acceptance tests with isolated database and object storage
        run: bash ../.github/scripts/acceptance.sh
        working-directory: api
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}

  # The real Worker before merge (docs/ci.md): dev's migrations then this change's, and this change's alone, must
  # apply and end with the same schema; then wrangler dev (workerd) serves wrangler.dev.jsonc's assets and routing on
  # the upgraded database with simulated SES, and every API route asked anonymously must be answered by the Worker.
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: fixture-admin
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('api/bun.lock', 'app/bun.lock') }}
      - run: for pkg in api app; do (cd "$pkg" && bun install --frozen-lockfile); done
      - run: cd app && bun run build
      - name: Migrations (fresh and upgraded), the Worker under wrangler dev, and every route
        working-directory: api
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: |
          # A pull request's checkout is GitHub's merge into the current base: its first parent is that base.
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then BASE=$(git rev-parse HEAD^1); fi
          export BASE
          bash ../.github/scripts/preview.sh

  # Layout shift on every main dashboard page (light and dark, cold load and in-app navigation, throttled network,
  # slow out-of-order API responses) against the production build and a throwaway API with synthetic data.
  # Fails above CLS 0.001 on any page; the longest task per in-app navigation is reported. Locally: cd app && bun run cls.
  cls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: fixture-admin
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      # Pull requests and merge queue entries run it when they touch the dashboard, the API or this workflow; every dev
      # push runs it. HEAD^1 of a pull request's merge checkout is the base branch; of a queue entry, the entries ahead.
      - name: Check for dashboard or API changes
        id: changes
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]] || ! git diff --quiet HEAD^1 HEAD -- app api .github/workflows/ci.yml; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No app/, api/ or CI changes: nothing to measure.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - if: steps.changes.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('api/bun.lock', 'app/bun.lock') }}
      - if: steps.changes.outputs.run == 'true'
        run: for pkg in api app; do (cd "$pkg" && bun install --frozen-lockfile); done
      # Builds the dashboard (build already type-checked it), then measures it with Chrome against Postgres.
      - name: Measure layout shift on every page
        if: steps.changes.outputs.run == 'true'
        working-directory: app
        env:
          CLS_PG_URL: postgresql://postgres:fixture-admin@127.0.0.1:5432/postgres
        run: ./node_modules/.bin/vite build && node scripts/cls.mjs
      - name: Upload the shift sources
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cls-shift-sources
          path: app/.cls/
          include-hidden-files: true
          retention-days: 14

  # The support Worker (support/, the AI support agent's backend): types, the deployable bundle, and its tests, which
  # drive that bundle in Miniflare with a fake Bane and a scripted model (no network, no model calls). Not required yet.
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('support/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: support
      - run: bun run check
        working-directory: support
      - run: bun run test
        working-directory: support
