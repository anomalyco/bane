name: Release SDK

# Publishes @banemx/sdk from dev, following Deadbolt's publish.yml: the
# version is decided, the package is built, npm publishes it, and only then do
# the v<version> tag and the GitHub release exist, so a failed run leaves
# neither. There is no npm token: the release environment's OIDC token is the
# credential for the trusted publisher configured on @banemx/sdk (repository,
# this file name and the environment are part of that configuration), the way
# OpenCode's publish-npm.sh publishes without one.
#
# Deadbolt commits its versions to its release branch through a changesets
# "Version packages" pull request. Bane's dev only admits thdxr and R44VC0RP,
# and only with build and acceptance green on that exact commit; production is
# fast-forward only from dev. So this workflow never commits: it computes the
# next version from the newest v<X.Y.Z> tag (or from sdk/package.json before
# the first tag), sets it in the workspace only, and the tag it pushes on the
# dispatched commit is the version of record.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Build and check the package without publishing, tagging, or releasing
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish an in-flight publish before another run checks the registry.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an authorized actor
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          case "$ACTOR" in
            thdxr|R44VC0RP) exit 0 ;;
          esac
          echo "::error::Only thdxr and R44VC0RP may release (actor: $ACTOR)."
          exit 1
      - name: Require dev
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ $REF != refs/heads/dev ]]; then
            echo "::error::Dispatch the release from dev, not $REF."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # every tag, for the next version
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or newer; a GitHub-hosted runner.
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@^11.15.0
      - id: version
        name: Compute the next version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -n "$latest" ]; then
            base=${latest#v}
          else
            base=$(node -p "require('./sdk/package.json').version")
          fi
          [[ $base =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Cannot bump $base; expected X.Y.Z."; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Unknown bump $BUMP."; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged; publish a newer version instead."
            exit 1
          fi
          if [ "$(npm view "@banemx/sdk@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::error::@banemx/sdk@$version is already published; tag and release it by hand, or publish a newer version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing @banemx/sdk@$version from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Set the version
        working-directory: sdk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: bun install --frozen-lockfile
        working-directory: sdk
      - run: bun run build
        working-directory: sdk
      - name: Publish
        working-directory: sdk
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A clean user config, so nothing in the checkout can redirect the
          # registry or supply a token: trusted publishing uses the OIDC token.
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          flags=(--access public)
          if [ "$DRY_RUN" = 'true' ]; then
            flags+=(--dry-run)
          else
            flags+=(--provenance)
          fi
          npm publish "${flags[@]}"
      # Only after a successful publish: the tag names the dispatched commit
      # (a bare `gh release create` would tag dev's current tip instead), and
      # the release links the generated notes.
      - name: Tag and release
        if: inputs.dry_run == false
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes
