name: Release SDK

# Publishes @banemx/sdk from dev. Split so no repository or dependency code
# ever runs while release credentials exist, the way OpenCode separates its
# build and publish jobs:
#
# - build runs repository code (bun install, bun run build, npm pack) with
#   contents: read, no environment and no id-token. It computes the next
#   version, packs the tarball and uploads it as an artifact.
# - publish runs in the release environment (this is where a reviewer
#   approves), with contents: write and id-token: write. It never checks out
#   the repository or runs a script from it: it downloads the tarball, checks
#   its manifest as data, publishes it with the environment's OIDC token, and
#   then tags the build's commit and creates the GitHub release.
#
# There is no npm token: the trusted publisher configured on @banemx/sdk
# matches this file name, the repository and the release environment. Provenance
# comes from the publish job's OIDC token and GitHub runner environment, not
# from a checkout, so publishing a prebuilt tarball keeps it.
#
# The version comes from the newest v<X.Y.Z> tag (or from sdk/package.json
# before the first tag), is set in the build workspace only, and is never
# committed: dev only admits thdxr and R44VC0RP with build and acceptance green,
# and production is fast-forward only from dev. The tag on the dispatched commit
# is the version of record.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Build and check the package without publishing, tagging, or releasing
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish an in-flight publish before another run checks the registry.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require an authorized actor
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          case "$ACTOR" in
            thdxr|R44VC0RP) exit 0 ;;
          esac
          echo "::error::Only thdxr and R44VC0RP may release (actor: $ACTOR)."
          exit 1
      - name: Require dev
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ $REF != refs/heads/dev ]]; then
            echo "::error::Dispatch the release from dev, not $REF."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # every tag, for the next version
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - id: version
        name: Compute the next version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -n "$latest" ]; then
            base=${latest#v}
          else
            base=$(node -p "require('./sdk/package.json').version")
          fi
          [[ $base =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Cannot bump $base; expected X.Y.Z."; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Unknown bump $BUMP."; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged; publish a newer version instead."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing @banemx/sdk@$version from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Set the version
        working-directory: sdk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: bun install --frozen-lockfile
        working-directory: sdk
      - run: bun run build
        working-directory: sdk
      - name: Pack
        working-directory: sdk
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          jq -e 'length == 1 and (.[0].filename | endswith(".tgz"))' "$RUNNER_TEMP/pack.json" > /dev/null
          echo "Packed $(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ needs.build.outputs.sha }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # No checkout, bun or repository files in this job: it only runs the npm
      # CLI and SHA-pinned actions on the artifact, which it treats as data.
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      # Node 24.16.0 bundles npm 11.13.0 (trusted publishing requires >=11.5.1);
      # no unpinned npm install in a job holding publish rights.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-package
          path: ${{ runner.temp }}/package
      - name: Check the package
        run: |
          tarball=$(find "$RUNNER_TEMP/package" -maxdepth 1 -name '*.tgz' -print -quit)
          [ -n "$tarball" ] || { echo "::error::No tarball in the downloaded artifact."; exit 1; }
          IFS=$'\t' read -r name version install_scripts < <(tar -xzOf "$tarball" package/package.json |
            jq -r '[.name, .version, ((.scripts // {}) | (has("preinstall") or has("install") or has("postinstall")))] | @tsv')
          [ "$name" = '@banemx/sdk' ] || { echo "::error::Unexpected package $name in $tarball."; exit 1; }
          [ "$version" = "$VERSION" ] || { echo "::error::Tarball has version $version, expected $VERSION."; exit 1; }
          [ "$install_scripts" = false ] || { echo "::error::$name has an install script."; exit 1; }
          if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::error::$name@$VERSION is already published; publish a newer version."
            exit 1
          fi
          echo "Publishing $name@$VERSION from $(basename "$tarball")." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          tarball=$(find "$RUNNER_TEMP/package" -maxdepth 1 -name '*.tgz' -print -quit)
          # A clean user config, so nothing can redirect the registry or supply
          # a token: trusted publishing uses the OIDC token.
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          flags=(--access public)
          if [ "$DRY_RUN" = 'true' ]; then
            flags+=(--dry-run)
          else
            flags+=(--provenance)
          fi
          npm publish "$tarball" "${flags[@]}"
      # Only after a successful publish: the tag names the build's commit (a
      # bare `gh release create` would tag dev's current tip instead), and the
      # release links the generated notes.
      - name: Tag and release
        if: inputs.dry_run == false
        run: |
          tag="v$VERSION"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
