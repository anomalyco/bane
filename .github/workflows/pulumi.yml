name: Pulumi

on:
  push:
    branches:
      - dev
      - production
    paths:
      - "infra/pulumi/**"
      - ".github/workflows/pulumi.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pulumi-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # workflow_dispatch from main has no matching environment; dispatch the
    # dev or production branch instead.
    if: github.ref_name == 'dev' || github.ref_name == 'production'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for a Pulumi program
        id: program
        run: |
          if [ -f "infra/pulumi/${GITHUB_REF_NAME}/Pulumi.yaml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/pulumi/${GITHUB_REF_NAME}/Pulumi.yaml does not exist yet; skipping deploy"
          fi

      - name: Authenticate with AWS for secrets
        if: steps.program.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-${{ github.ref_name }}
          aws-region: us-east-1

      - name: Read Cloudflare token
        if: steps.program.outputs.exists == 'true'
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,bane/${{ github.ref_name }}/PULUMI_CLOUDFLARE_API_TOKEN

      - name: Authenticate with AWS for state
        if: steps.program.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # dev -> 905840579680, production -> 009882681002
          role-to-assume: arn:aws:iam::${{ github.ref_name == 'dev' && '905840579680' || '009882681002' }}:role/github/bane-${{ github.ref_name }}-pulumi
          aws-region: us-east-1

      - name: Setup Bun
        if: steps.program.outputs.exists == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.program.outputs.exists == 'true'
        working-directory: infra/pulumi/${{ github.ref_name }}
        run: bun install --frozen-lockfile

      - name: Deploy
        if: steps.program.outputs.exists == 'true'
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: up
          stack-name: ${{ github.ref_name }}
          work-dir: infra/pulumi/${{ github.ref_name }}
          cloud-url: s3://bane-${{ github.ref_name }}-pulumi?region=us-east-1
          pulumi-version: 3.274.1
          suppress-progress: true
