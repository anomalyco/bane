name: Verify secrets

# Temporary: confirms each bane/<stage>/* secret is readable through the
# environment's role. Prints a name per secret, never a value.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-dev
          role-session-name: bane-dev-verify-${{ github.run_id }}
          aws-region: us-east-1
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,bane/dev/CLOUDFLARE_API_TOKEN
            DEV_DATABASE_URL,bane/dev/DEV_DATABASE_URL
            DEV_E2E_API_KEY,bane/dev/DEV_E2E_API_KEY
          parse-json-secrets: false
      - name: Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          DEV_DATABASE_URL: ${{ env.DEV_DATABASE_URL }}
          DEV_E2E_API_KEY: ${{ env.DEV_E2E_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN DEV_DATABASE_URL DEV_E2E_API_KEY; do
            [ -n "${!name:-}" ] || { echo "::error::$name is empty"; exit 1; }
          done
          case "$DEV_DATABASE_URL" in postgres*) ;; *) echo "::error::DEV_DATABASE_URL is not a postgres url"; exit 1 ;; esac
          for name in CLOUDFLARE_API_TOKEN DEV_DATABASE_URL DEV_E2E_API_KEY; do
            echo "$name ok"
          done

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-production
          role-session-name: bane-production-verify-${{ github.run_id }}
          aws-region: us-east-1
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,bane/production/CLOUDFLARE_API_TOKEN
            PROD_DATABASE_URL,bane/production/PROD_DATABASE_URL
            PROD_E2E_API_KEY,bane/production/PROD_E2E_API_KEY
          parse-json-secrets: false
      - name: Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          PROD_DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
          PROD_E2E_API_KEY: ${{ env.PROD_E2E_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN PROD_DATABASE_URL PROD_E2E_API_KEY; do
            [ -n "${!name:-}" ] || { echo "::error::$name is empty"; exit 1; }
          done
          case "$PROD_DATABASE_URL" in postgres*) ;; *) echo "::error::PROD_DATABASE_URL is not a postgres url"; exit 1 ;; esac
          for name in CLOUDFLARE_API_TOKEN PROD_DATABASE_URL PROD_E2E_API_KEY; do
            echo "$name ok"
          done
