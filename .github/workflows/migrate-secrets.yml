name: Migrate secrets

# Temporary: copies the environment's GitHub secrets into AWS Secrets Manager
# under bane/<stage>/. Delete once the deploy workflows read from AWS.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-dev
          role-session-name: bane-dev-migrate-${{ github.run_id }}
          aws-region: us-east-1
      - name: CLOUDFLARE_API_TOKEN
        env:
          V: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$V" ] || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id bane/dev/CLOUDFLARE_API_TOKEN --secret-string "$V" > /dev/null
      - name: DEV_DATABASE_URL
        env:
          V: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          [ -n "$V" ] || { echo "::error::DEV_DATABASE_URL is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id bane/dev/DEV_DATABASE_URL --secret-string "$V" > /dev/null
      - name: DEV_E2E_API_KEY
        env:
          V: ${{ secrets.DEV_E2E_API_KEY }}
        run: |
          [ -n "$V" ] || { echo "::error::DEV_E2E_API_KEY is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id bane/dev/DEV_E2E_API_KEY --secret-string "$V" > /dev/null

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-production
          role-session-name: bane-production-migrate-${{ github.run_id }}
          aws-region: us-east-1
      - name: CLOUDFLARE_API_TOKEN
        env:
          V: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$V" ] || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id bane/production/CLOUDFLARE_API_TOKEN --secret-string "$V" > /dev/null
      - name: PROD_DATABASE_URL
        env:
          V: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          [ -n "$V" ] || { echo "::error::PROD_DATABASE_URL is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id bane/production/PROD_DATABASE_URL --secret-string "$V" > /dev/null
      - name: PROD_E2E_API_KEY
        env:
          V: ${{ secrets.PROD_E2E_API_KEY }}
        run: |
          [ -n "$V" ] || { echo "::error::PROD_E2E_API_KEY is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id bane/production/PROD_E2E_API_KEY --secret-string "$V" > /dev/null
