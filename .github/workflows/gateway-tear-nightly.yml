name: Gateway tear (nightly)

# Deeper tear budgets than the PR gate in ci.yml, with a date-rotated seed, plus conformance
# against Dovecot on generated traces. Reduced witnesses are in the job log.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tear:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gateway/tear
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gateway/tear/target
          key: cargo-tear-${{ runner.os }}-${{ hashFiles('gateway/tear/Cargo.lock') }}
          restore-keys: cargo-tear-${{ runner.os }}-
      - name: Build
        env:
          TEAR_READ_TOKEN: ${{ secrets.TEAR_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TEAR_READ_TOKEN}@github.com/anomalyco/tear".insteadOf https://github.com/anomalyco/tear
          cargo build --release --locked
      - name: Deep runs
        run: |
          seed=$(date -u +%Y%m%d)
          fail=0
          run() {
            echo "::group::mailgw-tear $*"
            if ! ./target/release/mailgw-tear "$@" --seconds 600 > out.json; then fail=1; fi
            jq '{campaign, traces, steps, mismatched, totalMs, witnesses, model}' out.json
            echo '::endgroup::'
          }
          run edges 5 --minimal
          run edges 4
          run edges 3 --remote
          run random 200000 40 --seed "$seed"
          run random 20000 30 --remote --seed "$seed"
          run random 20000 30 --remote --shared-kid --sessions 3 --seed "$seed"
          run random 20000 30 --remote --split --sessions 3 --seed "$seed"
          run random 2000 30 --remote --bulk --seed "$seed"
          run random 20000 30 --remote --uploads --sessions 4 --shared-kid --seed "$seed"
          run smtp 50000 40 --seed "$seed"
          run smtp 5000 40 --remote --seed "$seed"
          run dovecot 1000 25 --seed "$seed"
          exit $fail
