name: Pulumi verify

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CF_ACCOUNT_ID: "15d29c8639fd3733b1b5486a2acfd968"
  R2_URL: s3://bane-dev-pulumi?endpoint=15d29c8639fd3733b1b5486a2acfd968.r2.cloudflarestorage.com&region=auto&s3ForcePathStyle=true&awssdk=v2&profile=r2

jobs:
  verify:
    name: Verify dev wiring
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-dev
          aws-region: us-east-1

      - name: Mint Cloudflare token and R2 credentials
        run: |
          set -euo pipefail
          set +x

          url="https://kjivkui2evldapbok5fhrrl6oy0fctkp.lambda-url.us-east-1.on.aws/"
          account="$CF_ACCOUNT_ID"
          url_pattern='^https://[a-z0-9]+\.lambda-url\.us-east-1\.on\.aws/$'
          if ! [[ "$url" =~ $url_pattern ]]; then echo "::error::bad token issuer URL"; exit 1; fi
          if ! [[ "$account" =~ ^[a-f0-9]{32}$ ]]; then echo "::error::bad account id"; exit 1; fi
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            [ -n "${!name:-}" ] || { echo "::error::$name is not set"; exit 1; }
          done

          response=$(
            printf 'user = "%s:%s"\nheader = "x-amz-security-token: %s"\n' \
              "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" |
              curl --config - \
                --proto '=https' --proto-redir '=https' \
                --aws-sigv4 "aws:amz:us-east-1:lambda" \
                --request POST --url "$url" \
                --fail-with-body --silent --show-error --max-time 20
          )
          token=$(printf '%s' "$response" | jq -er '.token | strings')
          expires=$(printf '%s' "$response" | jq -er '.expires_on | strings')
          case "$token" in ""|*[[:space:]]*) echo "::error::invalid token"; exit 1 ;; esac
          printf '::add-mask::%s\n' "$token"

          id=$(printf 'header = "Authorization: Bearer %s"\nurl = "https://api.cloudflare.com/client/v4/accounts/%s/tokens/verify"\n' \
            "$token" "$account" | curl --config - --silent --show-error --fail-with-body --max-time 20 |
            jq -er 'select(.success == true and .result.status == "active") | .result.id | strings')
          secret=$(printf %s "$token" | sha256sum | cut -d' ' -f1)
          printf '::add-mask::%s\n' "$secret"

          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.aws"
          {
            printf '\n[r2]\n'
            printf 'aws_access_key_id = %s\n' "$id"
            printf 'aws_secret_access_key = %s\n' "$secret"
          } >> "$HOME/.aws/credentials"
          {
            printf '\n[profile r2]\n'
            printf 'region = auto\n'
          } >> "$HOME/.aws/config"
          echo "::notice::Cloudflare token ready; expires $expires"

      - name: Check token reaches the Worker and the state bucket
        run: |
          set -euo pipefail
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
            curl --config - -s -o /dev/null -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/bane-dev")
          if [ "$code" != "200" ]; then echo "::error::worker read returned $code"; exit 1; fi
          echo "worker read ok"

      - name: Install Pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: 3.274.1

      - name: Exercise the R2 backend and KMS provider
        env:
          PULUMI_CONFIG_PASSPHRASE: unused
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cd "$dir"
          printf 'name: ci-probe\nruntime: yaml\nresources: {}\n' > Pulumi.yaml

          pulumi login "$R2_URL"
          if ! pulumi stack select ci-probe >/dev/null 2>&1; then
            pulumi stack init ci-probe --secrets-provider "awskms://alias/pulumi/bane-dev?region=us-east-1"
          fi
          pulumi config set --secret probe x
          pulumi preview --stack ci-probe --non-interactive
          pulumi stack rm ci-probe --yes
          echo "r2 backend + kms provider ok"

      - name: Assume the bane deploy role
        run: |
          set -euo pipefail
          creds=$(aws sts assume-role \
            --role-arn arn:aws:iam::905840579680:role/bane-deploy \
            --role-session-name pulumi-verify \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          set -- $creds
          {
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$1"
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$2"
            printf 'AWS_SESSION_TOKEN=%s\n' "$3"
          } >> "$GITHUB_ENV"
          echo "assumed bane-deploy"

      - name: Check the deploy role
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws iam get-user --user-name bane-runtime --query 'User.[UserName,PermissionsBoundary.PermissionsBoundaryArn]' --output text
          aws iam list-access-keys --user-name bane-runtime --query 'AccessKeyMetadata[].Status' --output text
          aws ses describe-active-receipt-rule-set --region us-east-2
          if aws iam get-policy --policy-arn arn:aws:iam::905840579680:policy/bane-runtime-boundary 2>/dev/null; then
            echo "::error::boundary policy must not be readable or editable"
            exit 1
          fi
          if aws iam get-role --role-name bane-deploy 2>/dev/null; then
            echo "::error::deploy role must not be able to read roles"
            exit 1
          fi
          echo "recipient + iam user reads ok; boundary and role reads denied"
