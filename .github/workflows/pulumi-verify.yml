name: Pulumi verify

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify dev wiring
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Authenticate with AWS for secrets
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/bane-dev
          aws-region: us-east-1

      - name: Read Cloudflare token
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,bane/dev/PULUMI_CLOUDFLARE_API_TOKEN

      - name: Secret present
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN ok (${#CLOUDFLARE_API_TOKEN} chars)"
          else
            echo "::error::CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi

      - name: Authenticate with AWS for state
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::905840579680:role/github/bane-dev-pulumi
          aws-region: us-east-1

      - name: Verify state access
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws s3 ls s3://bane-dev-pulumi
          aws kms describe-key --key-id alias/pulumi-state --query 'KeyMetadata.[Arn,KeyState]' --output text
          echo probe > /tmp/probe.txt
          aws s3 cp /tmp/probe.txt s3://bane-dev-pulumi/ci-probe.txt
          aws s3 cp s3://bane-dev-pulumi/ci-probe.txt /tmp/probe.out
          cmp /tmp/probe.txt /tmp/probe.out
          aws s3 rm s3://bane-dev-pulumi/ci-probe.txt
          aws kms encrypt --key-id alias/pulumi-state --plaintext fileb:///tmp/probe.txt --query CiphertextBlob --output text | base64 -d > /tmp/probe.ct
          aws kms decrypt --ciphertext-blob fileb:///tmp/probe.ct --query Plaintext --output text | base64 -d | cmp - /tmp/probe.txt
          echo "s3 + kms ok"
