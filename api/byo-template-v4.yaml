AWSTemplateFormatVersion: '2010-09-09'
Description: Bane customer connection v4. Connects regional SES sending and signed feedback; receiving is optional.
Parameters:
  PlatformPrincipalArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:user/[A-Za-z0-9+=,.@_/-]+'
  ExternalId:
    Type: String
    NoEcho: true
    AllowedPattern: '[0-9a-f-]{36}'
  ConnectionId:
    Type: String
    AllowedPattern: 'conn_[0-9a-f]{32}'
  WorkspaceId:
    Description: Exact workspace for kept mail. Set when upgrading receiving to kept-v1.
    Type: String
    Default: disabled
    AllowedPattern: '(disabled|ws_[0-9a-f]{32})'
  ResourcePrefix:
    Description: Bane resources dedicated to this connection.
    Type: String
    AllowedPattern: 'bane-[0-9a-f]{20}'
  FeedbackUrl:
    Type: String
    AllowedPattern: 'https://[^/?#]+/v1/events/ses'
  ReceiveMail:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Conditions:
  Receiving: !Equals [!Ref ReceiveMail, 'true']
Resources:
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ResourcePrefix}-feedback'
      Tags:
        - { Key: 'bane:installation-id', Value: !Ref ConnectionId }
        - { Key: 'bane:purpose', Value: ses-feedback }
  FeedbackPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref FeedbackTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BaneOwner
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: ['sns:GetTopicAttributes', 'sns:SetTopicAttributes', 'sns:AddPermission', 'sns:RemovePermission', 'sns:DeleteTopic', 'sns:Subscribe', 'sns:ListSubscriptionsByTopic', 'sns:Publish']
            Resource: !Ref FeedbackTopic
          - Sid: BaneSesPublish
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals:
                'AWS:SourceAccount': !Ref AWS::AccountId
                'AWS:SourceArn':
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${TransactionalSet}'
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${MarketingSet}'
  TransactionalSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub '${ResourcePrefix}-transactional'
      SendingOptions: { SendingEnabled: true }
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]
        ValidationOptions: { ConditionThreshold: { ConditionThresholdEnabled: DISABLED } }
      Tags:
        - { Key: 'bane:installation-id', Value: !Ref ConnectionId }
        - { Key: 'bane:purpose', Value: ses-feedback }
  MarketingSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub '${ResourcePrefix}-marketing'
      SendingOptions: { SendingEnabled: true }
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]
        ValidationOptions: { ConditionThreshold: { ConditionThresholdEnabled: ENABLED, OverallConfidenceThreshold: { ConfidenceVerdictThreshold: MANAGED } } }
      Tags:
        - { Key: 'bane:installation-id', Value: !Ref ConnectionId }
        - { Key: 'bane:purpose', Value: ses-feedback }
  TransactionalEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: FeedbackPolicy
    Properties:
      ConfigurationSetName: !Ref TransactionalSet
      EventDestination:
        Name: !Sub '${ResourcePrefix}-events'
        Enabled: true
        MatchingEventTypes: [DELIVERY, BOUNCE, COMPLAINT, REJECT, RENDERING_FAILURE, DELIVERY_DELAY, OPEN, CLICK]
        SnsDestination: { TopicARN: !Ref FeedbackTopic }
  MarketingEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: FeedbackPolicy
    Properties:
      ConfigurationSetName: !Ref MarketingSet
      EventDestination:
        Name: !Sub '${ResourcePrefix}-events'
        Enabled: true
        MatchingEventTypes: [DELIVERY, BOUNCE, COMPLAINT, REJECT, RENDERING_FAILURE, DELIVERY_DELAY, OPEN, CLICK]
        SnsDestination: { TopicARN: !Ref FeedbackTopic }
  FeedbackSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: [BaneRole, TransactionalEvents, MarketingEvents]
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: https
      Endpoint: !Ref FeedbackUrl
      RawMessageDelivery: false
  BaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref PlatformPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'sts:ExternalId': !Ref ExternalId }
      Policies:
        - PolicyName: Sending
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ses:GetAccount', 'ses:ListEmailIdentities', 'cloudwatch:GetMetricData', 'ses:ApplyTrackingConfigurationOverrides']
                Resource: '*'
                Condition: { StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' } }
              - Effect: Allow
                Action: ses:GetEmailIdentity
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              - Effect: Allow
                Action: ses:CreateEmailIdentity
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
                Condition:
                  'ForAllValues:StringEquals': { 'aws:TagKeys': ['bane:domain-claim'] }
                  'Null': { 'aws:RequestTag/bane:domain-claim': 'false' }
              - Effect: Allow
                Action: ses:TagResource
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
                # Restrict the value as well: a key allowlist alone would let us tag a customer's
                # existing identity and then satisfy the DeleteEmailIdentity / MAIL FROM guard.
                Condition:
                  'ForAllValues:StringEquals': { 'aws:TagKeys': ['bane:domain-claim'] }
                  StringEquals: { 'aws:RequestTag/bane:domain-claim': '${aws:ResourceTag/bane:domain-claim}' }
                  'Null': { 'aws:ResourceTag/bane:domain-claim': 'false' }
              - Effect: Allow
                Action: ['ses:DeleteEmailIdentity', 'ses:PutEmailIdentityMailFromAttributes']
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
                Condition: { 'Null': { 'aws:ResourceTag/bane:domain-claim': 'false' } }
              - Effect: Allow
                Action: ['ses:GetConfigurationSet', 'ses:GetConfigurationSetEventDestinations']
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ResourcePrefix}-transactional'
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ResourcePrefix}-marketing'
              - Effect: Allow
                Action: ['ses:SendEmail', 'ses:SendRawEmail']
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ResourcePrefix}-transactional'
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ResourcePrefix}-marketing'
              - Effect: Allow
                Action: ['ses:GetEmailTemplate', 'ses:TestRenderEmailTemplate']
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:template/bane-*'
              - Effect: Allow
                Action: ['sns:ListTagsForResource', 'sns:ListSubscriptionsByTopic', 'sns:GetTopicAttributes', 'sns:GetSubscriptionAttributes']
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}-feedback'
        - !If
          - Receiving
          - PolicyName: Receiving
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ['ses:DescribeActiveReceiptRuleSet', 'ses:DescribeReceiptRuleSet', 'ses:CreateReceiptRuleSet', 'ses:SetActiveReceiptRuleSet', 'ses:CreateReceiptRule', 'ses:UpdateReceiptRule', 'ses:DeleteReceiptRule']
                  Resource: '*'
                  Condition: { StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' } }
                - Effect: Allow
                  Action: ['sns:CreateTopic', 'sns:TagResource', 'sns:ListTagsForResource', 'sns:SetTopicAttributes', 'sns:ListSubscriptionsByTopic']
                  Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}-inbound'
                - Effect: Allow
                  Action: sns:Subscribe
                  Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}-inbound'
                  Condition: { StringEquals: { 'sns:Protocol': https, 'sns:Endpoint': !Ref FeedbackUrl } }
                - Effect: Allow
                  Action: ['s3:ListBucket', 's3:CreateBucket', 's3:PutBucketOwnershipControls', 's3:PutBucketTagging', 's3:PutBucketPublicAccessBlock', 's3:PutBucketPolicy', 's3:PutLifecycleConfiguration']
                  Resource: !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}'
                  Condition: { StringEqualsIfExists: { 's3:ResourceAccount': !Ref 'AWS::AccountId' } }
                - Effect: Allow
                  Action: s3:GetObject
                  Condition: { StringEquals: { 's3:ResourceAccount': !Ref 'AWS::AccountId' } }
                  Resource:
                    - !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}/staging/*'
                    - !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}/workspaces/*/raw/*'
                    - !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}/workspaces/*/att/*'
                - Effect: Allow
                  Action: ['s3:PutObject','s3:PutObjectTagging']
                  Condition: { StringEquals: { 's3:ResourceAccount': !Ref 'AWS::AccountId' } }
                  Resource: !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}/workspaces/*/att/*'
                - Effect: Allow
                  Action: ['s3:PutObject','s3:PutObjectTagging','s3:AbortMultipartUpload']
                  Resource: !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}/workspaces/*/raw/*'
                  Condition:
                    StringEquals: {'s3:ResourceAccount': !Ref 'AWS::AccountId'}
                    StringEqualsIfExists: {'s3:RequestObjectTag/bane-kind': raw}
                    'ForAllValues:StringEquals': {'s3:RequestObjectTagKeys': bane-kind}
          - !Ref AWS::NoValue
  # Revision kept-v1. Keep ordinary raw's expiry/tag policy unchanged. Separate
  # managed policy so the existing receiving policy stays below its IAM size cap.
  KeptReceivingV1:
    Type: AWS::IAM::ManagedPolicy
    Condition: Receiving
    Properties:
      Roles: [!Ref BaneRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['s3:PutObject', 's3:PutObjectTagging']
            Resource: !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}/workspaces/${WorkspaceId}/raw/kept/msg_????????????????????????????????.eml'
            Condition:
              StringEquals: {'s3:ResourceAccount': !Ref 'AWS::AccountId', 's3:RequestObjectTag/bane-kind': kept}
              'ForAllValues:StringEquals': {'s3:RequestObjectTagKeys': bane-kind}
          - Effect: Allow
            Action: s3:PutObjectTagging
            Resource: !Sub 'arn:aws:s3:::${ResourcePrefix}-mail-${AWS::Region}/workspaces/${WorkspaceId}/raw/kept/msg_????????????????????????????????.eml'
            Condition:
              StringEquals: {'s3:ResourceAccount': !Ref 'AWS::AccountId', 's3:RequestObjectTag/bane-kind': orphan}
              'ForAllValues:StringEquals': {'s3:RequestObjectTagKeys': bane-kind}
Outputs:
  KeptReceivingPolicy:
    Condition: Receiving
    Value: !Sub 'kept-v1:${WorkspaceId}'
  AccountId:
    Description: Bane detects this account automatically. Use this ID only for manual verification.
    Value: !Ref AWS::AccountId
  RoleArn:
    Value: !GetAtt BaneRole.Arn
