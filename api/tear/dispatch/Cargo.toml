[package]
name = "bane-dispatch-tear"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: a model checker for the API's send path, not part of any workspace or build.
[workspace]

[dependencies]
statecheck = { git = "https://github.com/anomalyco/tear", rev = "f59e9fba3bd96173c3c0775f9f8df931a202939f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
