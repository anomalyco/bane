# Local/self-hosted infrastructure. Production may use external Postgres and S3 instead.
services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: bane
      POSTGRES_DB: bane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bane -d bane"]
      interval: 2s
      timeout: 2s
      retries: 15
  storage:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    ports: ["127.0.0.1:59000:9000"]
    volumes: ["objects:/data"]
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: bane-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://bane:${POSTGRES_PASSWORD}@postgres:5432/bane
      S3_ENDPOINT: http://storage:9000
      PORT: 8787
      HOST: 0.0.0.0
    ports: ["127.0.0.1:8793:8787"]
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }
  worker:
    image: bane-api:local
    command: ["node", "dist/runner.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://bane:${POSTGRES_PASSWORD}@postgres:5432/bane
      S3_ENDPOINT: http://storage:9000
      PORT: 8787
      HOST: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }
volumes:
  postgres:
  objects:
